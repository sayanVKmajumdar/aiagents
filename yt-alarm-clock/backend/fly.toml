# Fly.io alternative to Render. Deploy with:
#   cd backend && fly launch --no-deploy --copy-config
#   fly secrets set YTMUSIC_OAUTH_JSON="$(cat oauth.json)"
#   fly deploy
app = "yt-alarm-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  YTDLP_PLAYER_CLIENTS = "android ios tv_embedded"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
